name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run contrast
      - run: npm run taste:lint
      - name: Lighthouse (mobile)
        run: npm run lighthouse
      - name: Infrastructure (typecheck, assertions, synth)
        working-directory: infra
        env:
          CDK_DISABLE_CLI_TELEMETRY: 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run synth

  # The browsers run in Microsoft's Playwright image, which carries Chromium, Firefox, WebKit and their
  # system libraries, so nothing is installed with apt during the run.
  browsers:
    name: browsers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chromium, Firefox, WebKit; desktop and phone
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7
